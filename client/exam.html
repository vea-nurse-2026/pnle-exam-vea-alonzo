<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PNLE Practice Exams</title>
    <script>
      // Apply the saved theme before first paint (see src/exam/theme.tsx).
      try {
        var t = localStorage.getItem("pnle-theme");
        if (t !== "light" && t !== "dark" && t !== "gray") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.glass = localStorage.getItem("pnle-glass") === "on" ? "on" : "off";
      } catch (e) {}
    </script>
    <meta name="description" content="Board-style practice questions for the Philippine Nurse Licensure Examination." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/exam/main.tsx"></script>
  </body>
</html>
